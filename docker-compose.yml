
services:

  sites:
    build:
      context: .
      target: prod
    image: sites:0.0.1
    container_name: sites
    restart: unless-stopped
    mem_limit: 128M
    mem_reservation: 64M
    env_file:
      - .env.production
    volumes:
      - /var/log/trascender/sites:/srv/cf.sites/logs
    environment:
      NODE_ENV: production
      PORT: 2206
    ports:
      - "127.0.0.1:2206:2206"
